<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}">
      <img src="{{ "img/RoastPOSBlackBG1024x1024.png" | relURL }}" alt="RoastPOS logo" class="brand-logo">
      <div>
        <span class="brand-name">RoastPOS</span>
        <span class="brand-tag">POS for independent coffee shops</span>
      </div>
    </a>
    <nav class="main-nav" aria-label="Primary">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="header-actions">
      <a class="button ghost" href="#features">Features</a>
      <a class="button primary" href="mailto:{{ .Site.Params.supportEmail }}?subject=RoastPOS%20quote%20request">Get a quote</a>
    </div>
  </div>
</header>
